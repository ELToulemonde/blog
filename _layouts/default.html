<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'fr' }}">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main-content">{% if page.lang == 'en' %}Skip to content{% else %}Aller au contenu{% endif %}</a>
    {% include header.html %}
    <main class="page-content" id="main-content" tabindex="-1">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>
    {% include footer.html %}
  </body>
</html>
